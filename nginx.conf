server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compresión de texto (el HTML/CSS/JS viaja bastante más pequeño).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Cabeceras de seguridad básicas. Se heredan en los location que no
    # declaren su propio add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Healthcheck para Dokploy / Docker.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML sin caché: así un redeploy se ve al instante.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(?:pdf|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}
